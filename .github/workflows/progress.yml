name: Progress

on:
  pull_request:
    paths:
      - README.md
      - configure.py
      - progress/**
      - tools/update_progress.py
      - tools/tests/test_update_progress.py
      - .github/workflows/progress.yml
  push:
    branches: [main]
    paths:
      - README.md
      - progress/**
      - tools/update_progress.py
      - tools/tests/test_update_progress.py
      - .github/workflows/progress.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run progress tests
        run: python -m unittest tools.tests.test_update_progress -v

      - name: Verify badge files match the snapshot
        run: python tools/update_progress.py --check

      - name: Verify README exposes all progress badges
        shell: bash
        run: |
          grep -q 'decomp.dev/iirg4x/marioparty6.svg?mode=shield&measure=code' README.md
          grep -q 'decomp.dev/iirg4x/marioparty6.svg?mode=shield&measure=data' README.md
          grep -q 'progress%2Fdol.json' README.md
          grep -q 'progress%2Fdlls.json' README.md

      - name: Require refreshed progress after matching-status changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          # Each object's status and path, ignoring formatting, comments and compiler options.
          selections() {
            git show "$1:configure.py" | tr -d ' \t\r\n' | grep -oE 'Object\((Matching|NonMatching),"[^"]+"' | sort
          }
          base=$(git merge-base "$BASE_SHA" HEAD)
          if ! cmp -s <(selections "$base") <(selections HEAD); then
            changed=$(git diff --name-only "$base" HEAD)
            if ! grep -q '^progress/' <<< "$changed"; then
              echo 'Matching status changed, but the committed progress snapshot was not refreshed.'
              echo 'Run: python tools/build.py'
              exit 1
            fi
          fi
