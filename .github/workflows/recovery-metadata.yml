name: Recovery metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-workspace:
    # Draft pushes are checked locally to avoid notification spam. Automatic CI
    # starts when the PR is marked ready, then runs for later non-draft pushes.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required agent entrypoints
        shell: bash
        run: |
          required=(
            AGENTS.md
            CONTRIBUTING.md
            README.md
            CLAUDE.md
            GEMINI.md
            src/AGENTS.md
            tools/AGENTS.md
            docs/AGENTS.md
            config/recovery/AGENTS.md
            config/recovery/compiler_patterns.json
            config/recovery/knowledge_freshness.json
            docs/agent_quickstart.md
            docs/concurrent_agents.md
            docs/recovery_standard.md
            docs/context_workflow.md
            docs/blind_recovery_benchmark.md
            benchmarks/blind_recovery/README.md
            benchmarks/blind_recovery/manifest.json
            tools/agent.py
            tools/agent_queue.py
            tools/claim_diff.py
            tools/worktree_audit.py
            tools/owner_catalog.py
            tools/context_engine.py
            tools/local_evidence.py
            tools/knowledge_freshness.py
            tools/integration_finalize.py
            tools/worktree_manager.py
            tools/hooks.py
            tools/recovery_knowledge.py
            tools/knowledge_cards.py
            tools/blind_recovery.py
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/recovery-task.yml
          )
          failed=0
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required agent entrypoint: $path"
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify template cleanup
        shell: bash
        run: |
          forbidden=(.github.example .vscode.example README.example.md)
          failed=0
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Inactive template path remains: $path"
              find "$path" -maxdepth 3 -print 2>/dev/null || true
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify generated and retail files are untracked
        shell: bash
        run: |
          tracked="$(git ls-files -- build build.ninja objdiff.json ctx.c orig | sed '/^orig\/[^/]*\/\.gitkeep$/d')"
          if [[ -n "$tracked" ]]; then
            printf 'Generated or retail paths are tracked:\n%s\n' "$tracked"
            exit 1
          fi

      - name: Validate metadata, cards, freshness, and blind cases
        run: |
          python tools/recovery_index.py check
          python tools/knowledge_cards.py check
          python tools/knowledge_cards.py freshness
          python tools/blind_recovery.py audit

      - name: Compile public Python tools
        run: python -m compileall -q tools

      - name: Run public-safe tests
        run: python -m unittest discover -s tools/tests -v

      - name: Build operational owner catalog
        run: |
          python tools/agent.py catalog build
          python tools/agent.py catalog query REL:mdpartydll:mdparty
          python tools/agent.py catalog query src/game/mgdata.c

      - name: Check workspace, queue migration, and worktrees
        run: |
          python tools/agent.py doctor
          python tools/agent.py queue check
          python tools/worktree_audit.py

      - name: Build and query recovery index
        run: |
          python tools/recovery_index.py build
          python tools/recovery_index.py query "broad header"
          python tools/recovery_index.py query "inspect caller and consumer widths"

      - name: Verify symptom-aware target context
        run: |
          python tools/knowledge_cards.py function fn_1_BBD8 \
            --owner REL:mdpartydll:mdparty \
            --symptom "helper boundary" \
            --limit 5
          mkdir -p build/context
          printf '%s\n' '{"functions":[{"matchPercent":100},{"matchPercent":90}],"relocations":[]}' \
            > build/context/synthetic-objdiff.json
          python tools/agent.py context function fn_1_BBD8 \
            --owner REL:mdpartydll:mdparty \
            --symptom "helper boundary" \
            --report build/context/synthetic-objdiff.json \
            --budget 12000 \
            --output build/context/mdparty-BBD8.md
          grep -q "Relevant recovered knowledge" build/context/mdparty-BBD8.md
          grep -q "Local object-diff evidence" build/context/mdparty-BBD8.md
          grep -q "gc132-helper-boundary-lifetime" build/context/mdparty-BBD8.md
          grep -q "mdparty-tail-definition-chronology" build/context/mdparty-BBD8.md
          grep -q "Acceptance criteria" build/context/mdparty-BBD8.md

      - name: Verify organicity review separates retained source debt
        run: |
          python tools/blind_recovery.py organicity \
            src/gssdk_lib/asrpho/common/blocks/flfxblks/lkahead.c \
            --function ProcessLookAhead \
            --json > build/context/lookahead-organicity.json
          grep -q "guaranteed-post-loop-condition" build/context/lookahead-organicity.json
          python tools/blind_recovery.py organicity \
            src/gssdk_lib/asrpho/common/blocks/stacker.c \
            --function ProcessStacker

      - name: Verify owner context, report, and wave audit
        run: |
          python tools/agent.py context owner main:game/mgdata \
            --budget 6000 \
            --output build/context/agent-smoke-context.md
          python tools/agent.py report
          python tools/knowledge_cards.py audit --max-items 5

      - name: Check changed paths and source quality
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git diff --check "$BASE_SHA...HEAD"
          changed_forbidden="$(git diff --name-only "$BASE_SHA...HEAD" | grep -E '^(orig/|build/|build\.ninja$|objdiff\.json$|ctx\.c$)' || true)"
          if [[ -n "$changed_forbidden" ]]; then
            printf 'Private/generated paths changed:\n%s\n' "$changed_forbidden"
            exit 1
          fi
          python tools/source_quality.py --changed "$BASE_SHA" --strict
