name: Recovery metadata

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run public-safe agent gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            python tools/agent.py check --base "$BASE_SHA"
          else
            python tools/agent.py check
          fi
