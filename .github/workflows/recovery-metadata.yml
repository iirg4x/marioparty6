name: Recovery metadata

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required agent entrypoints
        shell: bash
        run: |
          required=(
            AGENTS.md
            CONTRIBUTING.md
            README.md
            src/AGENTS.md
            tools/AGENTS.md
            docs/AGENTS.md
            config/recovery/AGENTS.md
            docs/agent_quickstart.md
            docs/recovery_standard.md
            docs/context_workflow.md
            tools/agent.py
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/recovery-task.yml
          )
          failed=0
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required agent entrypoint: $path"
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify template cleanup
        shell: bash
        run: |
          forbidden=(.github.example .vscode.example README.example.md)
          failed=0
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Inactive template path remains: $path"
              find "$path" -maxdepth 3 -print 2>/dev/null || true
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify generated and retail files are untracked
        shell: bash
        run: |
          tracked="$(git ls-files -- build build.ninja objdiff.json ctx.c orig | sed '/^orig\/[^/]*\/\.gitkeep$/d')"
          if [[ -n "$tracked" ]]; then
            printf 'Generated or retail paths are tracked:\n%s\n' "$tracked"
            exit 1
          fi

      - name: Validate recovery metadata
        run: python tools/recovery_index.py check

      - name: Check agent workspace
        run: python tools/agent.py doctor

      - name: Compile public Python tools
        run: python -m compileall -q tools

      - name: Run public-safe tests
        run: python -m unittest discover -s tools/tests -v

      - name: Build recovery index
        run: python tools/recovery_index.py build

      - name: Smoke-test context and report generation
        run: |
          python tools/agent.py context owner main:game/mgdata \
            --budget 6000 \
            --output build/context/agent-smoke-context.md
          python tools/agent.py report

      - name: Check changed paths and source quality
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git diff --check "$BASE_SHA...HEAD"
          changed_forbidden="$(git diff --name-only "$BASE_SHA...HEAD" | grep -E '^(orig/|build/|build\.ninja$|objdiff\.json$|ctx\.c$)' || true)"
          if [[ -n "$changed_forbidden" ]]; then
            printf 'Private/generated paths changed:\n%s\n' "$changed_forbidden"
            exit 1
          fi
          python tools/source_quality.py --changed "$BASE_SHA" --strict
