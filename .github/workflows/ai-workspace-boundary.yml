name: AI workspace boundary

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  protect-human-main:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject AI-workspace ancestry and infrastructure
        shell: bash
        run: |
          failed=0

          if [[ "$GITHUB_HEAD_REF" == "agent/recovery-context-workflow" ]]; then
            echo 'The permanent AI recovery workspace must never merge into main.'
            failed=1
          fi

          markers=(
            AI_WORKSPACE.md
            tools/agent.py
            tools/agent_queue.py
            tools/promote_recovered_c.py
            config/recovery/project.json
            benchmarks/blind_recovery/manifest.json
          )

          for path in "${markers[@]}"; do
            if [[ -e "$path" ]]; then
              echo "AI workspace marker present in a main-targeting PR: $path"
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo 'Create a fresh recovery/* branch directly from main and copy only verified src/**/*.c blobs.'
            exit 1
          fi

          echo 'No AI workspace markers detected in this main-targeting branch.'

  non-main-pr:
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'AI workspace boundary guard is not applicable to this internal PR.'
