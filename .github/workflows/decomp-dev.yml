name: decomp.dev report

# decomp.dev (https://decomp.dev/iirg4x/marioparty6) reads the objdiff progress
# report from this workflow's GP6E01_report artifact. GitHub's runners have no
# game files, so the report is generated by `python tools/build.py` on a machine
# that has them and committed as progress/report.json; this workflow uploads it
# on every push to main that changes it.

on:
  push:
    branches: [main]
    paths:
      - progress/report.json
      - .github/workflows/decomp-dev.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check that the report is valid JSON
        run: python3 -c "import json; json.load(open('progress/report.json', encoding='utf-8'))"

      - name: Upload report for decomp.dev
        uses: actions/upload-artifact@v4
        with:
          name: GP6E01_report
          path: progress/report.json
          if-no-files-found: error
