name: Recovery task
description: Queue one owner or tightly connected recovery question.
title: "recovery: "
body:
  - type: markdown
    attributes:
      value: |
        One worker owns one translation unit or tightly connected cluster. Claude and Codex on one PC must use separate worktrees, branches, and build directories. Workers stop at ready; the integration worktree supplies retail proof and finalizes done.

  - type: input
    id: owner
    attributes:
      label: Operational owner ID
      description: Query `python tools/agent.py catalog query <term>` and use the configured owner when possible.
      placeholder: "REL:mdpartydll:mdparty"
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source path
      placeholder: "src/REL/mdpartydll/mdparty.c"
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Stable target identity and symbol
      placeholder: "mdpartydll:0xBBD8 — fn_1_BBD8"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Intended worker
      options:
        - Claude
        - Codex
        - Human
        - Unassigned queue task
    validations:
      required: true

  - type: textarea
    id: scheduling
    attributes:
      label: Scheduling metadata
      description: Priority, batch, dependencies, required capabilities, expected work cost, verification cost, and change class.
      placeholder: |
        Priority: high
        Batch: board-pass-1
        Depends on: main:game/board-data
        Capabilities: mwcc
        Change class: private-source
        Cost: work 2 / verification 3

  - type: textarea
    id: shared_paths
    attributes:
      label: Expected shared write paths
      description: Central headers, configure.py, symbols, splits, or recovery schemas. State None for owner-local work.

  - type: textarea
    id: question
    attributes:
      label: Research question
      description: State the semantic, ownership, data-domain, or compiler-shape question.
    validations:
      required: true

  - type: dropdown
    id: binary
    attributes:
      label: Current binary status
      options:
        - fallback
        - partial
        - exact
        - unknown
    validations:
      required: true

  - type: textarea
    id: knowledge
    attributes:
      label: Applicable recovery knowledge and symptoms
      description: List the command, symptoms, selected rules/heuristics/constraints, counterexamples, and freshness warnings.
      placeholder: |
        Command: python tools/agent.py knowledge function fn_1_BBD8 --owner REL:mdpartydll:mdparty --symptom "helper boundary"
        Cards: gc132-helper-boundary-lifetime; mdparty-tail-definition-chronology
        Freshness: active
        Counterexamples: stage is not a tail-definition template
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Known evidence
      description: Target instructions, relocations, callers, consumers, same-game domains, sibling source, local reports, and rejected probes.
    validations:
      required: true

  - type: textarea
    id: consumers
    attributes:
      label: Expected consumers and integration scope
      description: Matching consumers, shared interfaces, affected REL/DOL containers, and required machine resources.

  - type: textarea
    id: knowledge_output
    attributes:
      label: Expected reusable knowledge output
      description: Possible card/example/counterexample/freshness update or owner-only evidence. Do not invent a card to fill the field.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - Owner and shared paths claimed before editing
        - Real committed/staged/unstaged/untracked diff stays inside the claim
        - Selected knowledge, symptoms, freshness, and counterexamples reviewed
        - Natural candidate documented before compiler reconciliation
        - No independently exact regression
        - Relocation-aware object and affected-consumer results recorded
        - Reusable finding and freshness updated when learned
        - Worker public gate passes on a clean committed tree
        - Structured queue verification recorded for that exact commit
        - Worker task reaches ready
        - Integration resources are acquired before full retail build
        - Retail/checksum/byte gates pass before integration finalization
    validations:
      required: true

  - type: checkboxes
    id: isolation
    attributes:
      label: Task isolation
      options:
        - label: I will use a dedicated branch, worktree, and build directory.
          required: true
        - label: I will use the queue and will not bypass owner, dependency, shared-path, or resource conflicts.
          required: true
        - label: I will run queue check-diff before commits and handoff.
          required: true
        - label: I will not commit retail inputs, queue state, or generated build/context files.
          required: true
        - label: I will not repeat a recorded probe without explaining why existing evidence is insufficient.
          required: true
