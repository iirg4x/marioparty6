name: Recovery task
description: Queue one source owner or a tightly connected recovery question.
title: "recovery: "
body:
  - type: markdown
    attributes:
      value: |
        Keep one agent on one translation unit or tightly connected function cluster. Claude and Codex on the same PC must use separate worktrees, branches, and build directories. Add the task to the local claim queue, generate bounded context, and review automatically selected recovery knowledge before editing.

  - type: input
    id: owner
    attributes:
      label: Queue owner key
      description: Use a configured recovery owner ID when one exists; otherwise use the source path.
      placeholder: "REL:mdpartydll:mdparty or src/board/tutorial.c"
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source owner path
      placeholder: "src/REL/mdpartydll/mdparty.c"
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Stable target identity and symbol
      placeholder: "mdpartydll:0xBBD8 — fn_1_BBD8"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Intended worker
      options:
        - Claude
        - Codex
        - Unassigned queue task
        - Integration worktree
    validations:
      required: true

  - type: textarea
    id: shared_paths
    attributes:
      label: Expected shared files
      description: List central headers, configure.py, symbols, splits, or recovery schemas that must be declared in the local claim. State None when the task is owner-local.
      placeholder: |
        - include/game/board.h
        - configure.py

  - type: textarea
    id: question
    attributes:
      label: Research question
      description: State the semantic, ownership, data-domain, or compiler-shape question.
    validations:
      required: true

  - type: dropdown
    id: binary
    attributes:
      label: Current binary status
      options:
        - fallback
        - partial
        - exact
        - unknown
    validations:
      required: true

  - type: textarea
    id: knowledge
    attributes:
      label: Applicable recovery knowledge
      description: Run the context/knowledge command and list selected confirmed rules, heuristics, owner constraints, and counterexamples. Explain any card that is intentionally not applicable.
      placeholder: |
        Command: python tools/agent.py knowledge function fn_1_BBD8 --owner REL:mdpartydll:mdparty
        Cards:
        - mdparty-tail-definition-chronology — owner constraint
        - gc132-helper-boundary-lifetime — contextual heuristic
        Counterexamples:
        - stage is a counterexample to the general tail-definition shape
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Known evidence
      description: Target instructions, relocations, callers, consumers, same-game domains, sibling source, existing reports, rejected probes, and historical findings already distilled into cards.
    validations:
      required: true

  - type: textarea
    id: consumers
    attributes:
      label: Expected consumers and shared interfaces
      description: List headers, data owners, callers, or Matching consumers that may need verification.

  - type: textarea
    id: knowledge_output
    attributes:
      label: Expected reusable knowledge output
      description: State whether this task may add/refine a rule, example, counterexample, owner constraint, or only owner-specific evidence. Do not invent a card merely to fill the field.
      placeholder: "Possible new counterexample for gc132-broad-header-visibility; otherwise owner evidence only."

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - Owner claimed in the shared local queue before editing
        - Shared files declared in the claim before editing
        - Automatically selected knowledge cards and counterexamples reviewed
        - Natural evidence-supported candidate documented
        - No independently exact regression
        - Relocation-aware object result recorded
        - Affected consumers checked
        - Reusable source-to-output finding distilled when one was learned
        - Recovery metadata updated
        - Last verified commit recorded in the queue
        - Public agent gate passes
        - Required private retail gates pass before promotion
        - Claim released after handoff
    validations:
      required: true

  - type: checkboxes
    id: isolation
    attributes:
      label: Task isolation
      options:
        - label: I will use a dedicated `agent/<agent>-<owner>-<goal>` branch and worktree.
          required: true
        - label: I will use a build directory that is not shared with another active agent.
          required: true
        - label: I will claim this owner through `python tools/agent.py queue claim` before editing.
          required: true
        - label: I will not bypass a queue conflict for a shared owner or path.
          required: true
        - label: I will not commit retail inputs, queue state, or generated build/context files.
          required: true
        - label: I will not repeat a recorded compiler probe without explaining why the existing card/evidence is insufficient.
          required: true
